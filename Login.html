<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SIMPUS-Mini | Login</title>

    <!-- CSS milik kita sendiri -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>

    <!-- ===== Navbar ===== -->
    <header>
      <h1>
        <a href="index.html">SIMPUS-Mini</a>
      </h1>

      <!-- Tombol hamburger -->
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

      <!-- Menu -->
      <nav>
        <ul>
          <li>
            <a href="index.html">Beranda</a>
          </li>

          <li>
            <a href="buku/list.html">Daftar Buku</a>
          </li>

          <li>
            <a href="buku/tambah.html">Tambah Buku</a>
          </li>

          <li>
            <a href="anggota/list.html">Daftar Anggota</a>
          </li>

          <li>
            <a href="Login.html">Login</a>
          </li>
        </ul>
      </nav>
    </header>


    <!-- ===== Halaman Login ===== -->
    <main>

      <section class="login-section">

        <!-- Card Login -->
        <div class="login-card">

          <!-- Judul -->
          <h2>Login</h2>

          <p class="login-description">
            Silakan masuk ke akun Anda
          </p>


          <!-- Form -->
          <form>

            <!-- Username -->
            <div class="form-group">
              <label for="username">
                Username
              </label>

              <input
                type="text"
                id="username"
                name="username"
                placeholder="Masukkan username"
                required
              />
            </div>


            <!-- Password -->
            <div class="form-group">
              <label for="password">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
                required
              />
            </div>


            <!-- Ingat saya -->
            <div class="remember">
              <input
                type="checkbox"
                id="remember"
                name="remember"
              />

              <label for="remember">
                Ingat saya
              </label>
            </div>


            <!-- Tombol Login -->
            <button type="submit" class="login-button">
              Login
            </button>


            <!-- Register -->
            <p class="register-link">
              Belum punya akun,
              <a href="Register.html">
                Register dulu yuks
              </a>
            </p>

          </form>

        </div>

      </section>

    </main>


    <!-- ===== Footer ===== -->
    <footer>
      <p>
        &copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (CSS)
      </p>
    </footer>

  </body>
</html>
