<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SIMPUS-Mini | Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS milik kita sendiri -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="bg-light">
    <!-- ===== Navbar ===== -->
    <header
      class="navbar navbar-expand-lg navbar-dark"
      style="background-color: #1d5b8a"
    >
      <div class="container">
        <!-- Logo / Nama website -->
        <a class="navbar-brand fw-semibold" href="index.html"> SIMPUS-Mini </a>

        <!-- Tombol hamburger -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <nav class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html"> Beranda </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="buku/list.html"> Daftar Buku </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="buku/tambah.html"> Tambah Buku </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="anggota/list.html"> Daftar Anggota </a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="Login.html"> Login </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- ===== Halaman Login ===== -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <!-- Lebar form -->
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <!-- Card Login -->
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <!-- Judul -->
              <h2 class="text-center mb-2">Login</h2>

              <p class="text-center text-secondary mb-4">
                Silakan masuk ke akun Anda
              </p>

              <!-- Form -->
              <form>
                <!-- Username -->
                <div class="mb-3">
                  <label for="username" class="form-label"> Username </label>

                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    required
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label"> Password </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    required
                  />
                </div>

                <!-- Ingat saya -->
                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  />

                  <label class="form-check-label" for="remember">
                    Ingat saya
                  </label>
                </div>

                <!-- Tombol Login -->
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Login</button>
                </div>

                <p class="text-center text-secondary mt-4 mb-0">
                  Belum punya akun, <a href="Register.html">Register dulu yuks</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="text-center text-secondary py-3 small">
      <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4 (Bootstrap)</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
