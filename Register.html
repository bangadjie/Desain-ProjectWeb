<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SIMPUS-Mini | Register</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- ===== Navbar ===== -->
    <nav class="navbar navbar-dark" style="background-color: #1d5b8a">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html"> SIMPUS-Mini </a>

        <a href="Login.html" class="btn btn-outline-light"> Login </a>
      </div>
    </nav>

    <!-- ===== Halaman Register ===== -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <!-- Lebar form register -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
          <!-- Card Register -->
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <!-- Judul -->
              <h2 class="text-center mb-2">Buat Akun</h2>

              <p class="text-center text-secondary mb-4">
                Silakan isi data untuk membuat akun baru
              </p>

              <!-- Form Register -->
              <form>
                <!-- Nama Lengkap -->
                <div class="mb-3">
                  <label for="nama" class="form-label"> Nama Lengkap </label>

                  <input
                    type="text"
                    class="form-control"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                  />
                </div>

                <!-- Username -->
                <div class="mb-3">
                  <label for="username" class="form-label"> Username </label>

                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    required
                  />
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label"> Email </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="contoh@email.com"
                    required
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label"> Password </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    required
                  />
                </div>

                <!-- Konfirmasi Password -->
                <div class="mb-3">
                  <label for="password_confirmation" class="form-label">
                    Konfirmasi Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password_confirmation"
                    name="password_confirmation"
                    placeholder="Masukkan kembali password"
                    required
                  />
                </div>

                <!-- Tombol Register -->
                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary">Daftar</button>
                </div>
              </form>

              <!-- Link Login -->
              <p class="text-center text-secondary mt-4 mb-0">
                Sudah punya akun?
                <a href="Login.html"> Login di sini </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="text-center text-secondary py-3 small">
      <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4 (Bootstrap)</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
